<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Manage your ResiHub account settings, privacy preferences, notifications, security and personal information.">

    <meta name="keywords"
        content="ResiHub settings, account settings, student profile, notifications, privacy, security, Nigeria">

    <meta name="author" content="ResiHub">

    <meta name="theme-color" content="#0F766E">

    <title>Account Settings | ResiHub</title>

    <!-- Favicon -->

    <link rel="icon" type="image/png" href="assets/images/favicon.png">

    <!-- Font Awesome -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Main Stylesheet -->

    <link rel="stylesheet" href="../styles/style.css">

</head>

<body>
    <div id="scrollProgress"></div>

    <div class="floating-shapes" aria-hidden="true">

        <span class="shape shape-1"></span>

        <span class="shape shape-2"></span>

        <span class="shape shape-3"></span>

        <span class="shape shape-4"></span>

    </div>
    <!-- HEADER / NAVIGATION-->

    <div id="header"></div>

    <main>

        <!-- Hero -->

        <section class="page-hero">

            <div class="container">

                <section class="auth-hero reveal fade-up">

                    <span class="page-badge floating-badge">

                        <i class="fa-solid fa-gear"></i>

                        Account Settings

                    </span>

                    <h1>Manage Your Account</h1>

                    <p>
                        Update your personal preferences, privacy, security and notification settings.
                    </p>

                </section>

            </div>

        </section>

        <!-- Settings Navigation -->

        <section class="settings-navigation">

            <div class="container">

                <div class="settings-tabs">

                    <button class="settings-tab active" data-tab="profile">

                        <i class="fa-solid fa-user"></i>

                        Profile

                    </button>

                    <button class="settings-tab" data-tab="security">

                        <i class="fa-solid fa-lock"></i>

                        Security

                    </button>

                    <button class="settings-tab" data-tab="notifications">

                        <i class="fa-solid fa-bell"></i>

                        Notifications

                    </button>

                    <button class="settings-tab" data-tab="privacy">

                        <i class="fa-solid fa-user-shield"></i>

                        Privacy

                    </button>

                </div>

            </div>

        </section>

        <!-- Settings Card -->

        <section class="settings-section">

            <div class="container">

                <div class="settings-card">

                    <div class="section-header">

                        <h2>Account Preferences</h2>

                    </div>

                    <form id="settingsForm">

                        <div class="form-group">

                            <label for="displayName">

                                Display Name

                            </label>

                            <input type="text" id="displayName" placeholder="Your display name">

                        </div>

                        <div class="form-group">

                            <label for="emailNotifications">

                                Email Notifications

                            </label>

                            <select id="emailNotifications">

                                <option value="enabled">Enabled</option>

                                <option value="disabled">Disabled</option>

                            </select>

                        </div>

                        <div class="form-group">

                            <label for="smsNotifications">

                                SMS Notifications

                            </label>

                            <select id="smsNotifications">

                                <option value="enabled">Enabled</option>

                                <option value="disabled">Disabled</option>

                            </select>

                        </div>

                        <div class="form-group">

                            <label for="themePreference">

                                Theme Preference

                            </label>

                            <select id="themePreference">

                                <option value="light">Light</option>

                                <option value="dark">Dark</option>

                                <option value="system">System Default</option>

                            </select>

                        </div>

                        <div class="settings-actions">

                            <button type="submit" class="btn-primary magnetic-btn ripple-btn shine-btn">

                                <i class="fa-solid fa-floppy-disk"></i>

                                Save Changes

                            </button>

                            <button type="reset" class="btn-secondary">

                                Reset

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </section>

    </main>

    <!-- FOOTER -->

    <div id="footer"></div>

    <script type="module" src="../js/loadStudent.js"></script>
    <script type="module" src="../js/settings.js" defer></script>

</body>

</html>
