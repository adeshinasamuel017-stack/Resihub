<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Landlord Profile | ResiHub</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="icon" type="image/png" href="assets/images/favicon.png">

    <meta name="description"
        content="Edit your ResiHub landlord profile, business details, emergency contact and account information.">

    <meta name="keywords"
        content="ResiHub landlord profile, edit landlord account, business profile, student accommodation Nigeria">

    <meta name="author" content="ResiHub">
</head>

<body>
    <div id="scrollProgress"></div>

    <div class="floating-shapes" aria-hidden="true">

        <span class="shape shape-1"></span>

        <span class="shape shape-2"></span>

        <span class="shape shape-3"></span>

        <span class="shape shape-4"></span>

    </div>

    <div id="header"></div>

    <main>
        <div class="profile-photo-section">
            <img id="profilePreview" src="assets/images/default-avatar.png" alt="Landlord Profile Photo">

            <label for="profileImage" class="upload-btn">
                <i class="fa-solid fa-camera" aria-hidden="true"></i>
                Change Photo
            </label>

            <input type="file" id="profileImage" accept="image/*" aria-label="Upload Profile Photo" hidden>
        </div>
        <div class="profile-card">
            <h2>Personal Information</h2>
            <div class="profile-grid">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" readonly>
                </div>
                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone">
                </div>
                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select id="gender">
                        <option value="">Select</option>
                        <option>Male</option>
                        <option>Female</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob">
                </div>
            </div>
        </div>
        <div class="profile-card">

            <h2>Business Information</h2>

            <div class="profile-grid">

                <div class="form-group">
                    <label for="businessName">Business Name</label>
                    <input type="text" id="businessName" placeholder="Business Name">
                </div>

                <div class="form-group">
                    <label for="cacNumber">CAC Registration Number</label>
                    <input type="text" id="cacNumber" placeholder="CAC Number">
                </div>

                <div class="form-group full-width">
                    <label for="businessDescription">Business Description</label>
                    <textarea id="businessDescription" rows="5" placeholder="Describe your business"></textarea>
                </div>

            </div>

        </div>
        <div class="profile-card">
            <h2>Emergency Contact</h2>
            <div class="profile-grid">
                <div class="form-group">
                    <label for="emergencyName">Full Name</label>
                    <input type="text" id="emergencyName">
                </div>
                <div class="form-group">
                    <label for="emergencyRelationship">Relationship</label>
                    <input type="text" id="emergencyRelationship">
                </div>
                <div class="form-group">
                    <label for="emergencyPhone">Phone</label>
                    <input type="tel" id="emergencyPhone">
                </div>
            </div>
        </div>
        <div class="profile-actions">
            <button id="saveProfileBtn" class="btn-primary magnetic-btn ripple-btn shine-btn">
                <i class="fa-solid fa-floppy-disk" aria-hidden="true"></i>
                Save Changes
            </button>
            <button id="cancelEditBtn" class="btn-primary magnetic-btn ripple-btn shine-btn">
                Cancel
            </button>
        </div>
    </main>
    <!--FOOTER-->

    <div id="footer"></div>

    <script type="module" src="../js/loadLandlord.js"></script>
    <script type="module" src="../js/landlord_Profile_edit.js"></script>
</body>

</html>
