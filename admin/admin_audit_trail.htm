<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Audit Trail | ResiHub</title>

    <meta name="description" content="Monitor security events, administrator audits and sensitive platform changes.">

    <meta name="keywords" content="ResiHub, Audit Trail, Security, Administrator">

    <meta name="author" content="ResiHub">

    <meta name="robots" content="noindex, nofollow">

    <link rel="canonical" href="https://www.resihub.com/admin_audit_trail.htm">

    <meta property="og:type" content="website">

    <meta property="og:title" content="Admin Audit Trail | ResiHub">

    <meta property="og:description" content="Track sensitive administrator activities and security events.">

    <meta property="og:url" content="https://www.resihub.com/admin_audit_trail.htm">

    <meta property="og:image" content="https://www.resihub.com/assets/images/og-image.jpg">

    <meta name="twitter:card" content="summary_large_image">

    <meta name="twitter:title" content="Admin Audit Trail | ResiHub">

    <meta name="twitter:description" content="Administrator security audit logs.">

    <meta name="twitter:image" content="https://www.resihub.com/assets/images/og-image.jpg">

    <link rel="icon" type="image/png" href="assets/images/favicon.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="../styles/style.css">

</head>

<body>

    <div id="scrollProgress"></div>

    <div class="floating-shapes" aria-hidden="true">

        <span class="shape shape-1"></span>

        <span class="shape shape-2"></span>

        <span class="shape shape-3"></span>

        <span class="shape shape-4"></span>

    </div>

    <div id="header"></div>

    <main>

        <section id="auditTrailContent" class="auth-section reveal fade-up">

            <div class="container">

                <div class="section-header">

                    <span class="page-badge floating-badge">

                        <i class="fa-solid fa-shield-halved"></i>

                        Security Audit

                    </span>

                    <h1>Audit Trail</h1>

                    <p>

                        Review sensitive administrator activities and security-related events across the platform.

                    </p>

                </div>

                <form id="auditFilterForm">

                    <input type="search" id="auditSearch" placeholder="Search administrator...">

                    <select id="auditSeverity">

                        <option value="">All Levels</option>

                        <option>Critical</option>

                        <option>High</option>

                        <option>Medium</option>

                        <option>Low</option>

                    </select>

                    <select id="auditEvent">

                        <option value="">All Events</option>

                        <option>Login</option>

                        <option>Failed Login</option>

                        <option>Password Reset</option>

                        <option>Permission Change</option>

                        <option>Account Locked</option>

                        <option>Listing Deleted</option>

                        <option>Database Access</option>

                    </select>

                    <input type="date" id="auditDate">

                    <button type="button" id="exportAuditBtn" class="btn-primary">

                        <i class="fa-solid fa-file-export"></i>

                        Export

                    </button>

                </form>

                <div class="dashboard-grid">

                    <div class="dashboard-card">

                        <i class="fa-solid fa-user-lock"></i>

                        <h3 id="securityIncidents">0</h3>

                        <p>Security Incidents</p>

                    </div>

                    <div class="dashboard-card">

                        <i class="fa-solid fa-user-secret"></i>

                        <h3 id="failedLogins">0</h3>

                        <p>Failed Logins</p>

                    </div>

                    <div class="dashboard-card">

                        <i class="fa-solid fa-key"></i>

                        <h3 id="permissionChanges">0</h3>

                        <p>Permission Changes</p>

                    </div>

                    <div class="dashboard-card">

                        <i class="fa-solid fa-triangle-exclamation"></i>

                        <h3 id="criticalAlerts">0</h3>

                        <p>Critical Alerts</p>

                    </div>

                </div>

                <div class="table-responsive">

                    <table class="admin-table">

                        <thead>

                            <tr>

                                <th>Timestamp</th>

                                <th>Administrator</th>

                                <th>Event</th>

                                <th>Severity</th>

                                <th>IP Address</th>

                                <th>Status</th>

                                <th>Details</th>

                            </tr>

                        </thead>

                        <tbody id="auditTrailTable">

                            <!-- JavaScript -->

                        </tbody>

                    </table>

                </div>

            </div>

        </section>

    </main>

    <div id="footer"></div>

    <script type="module" src="../js/loadAdmin.js"></script>
    <script type="module" src="../js/admin_audit_trail.js"></script>

</body>

</html>
