<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Backup & Restore | ResiHub</title>

    <meta name="description"
        content="Manage system backups, restore points and disaster recovery for the ResiHub platform.">

    <meta name="keywords" content="ResiHub, Backup, Restore, Recovery, Administrator">

    <meta name="author" content="ResiHub">

    <meta name="robots" content="noindex, nofollow">

    <link rel="canonical" href="https://www.resihub.com/admin_backup_restore.htm">

    <!-- Open Graph -->

    <meta property="og:type" content="website">

    <meta property="og:title" content="Admin Backup & Restore | ResiHub">

    <meta property="og:description" content="Protect ResiHub data with automated backups and recovery tools.">

    <meta property="og:url" content="https://www.resihub.com/admin_backup_restore.htm">

    <meta property="og:image" content="https://www.resihub.com/assets/images/og-image.jpg">

    <!-- Twitter -->

    <meta name="twitter:card" content="summary_large_image">

    <meta name="twitter:title" content="Admin Backup & Restore | ResiHub">

    <meta name="twitter:description" content="Administrator backup management.">

    <meta name="twitter:image" content="https://www.resihub.com/assets/images/og-image.jpg">

    <link rel="icon" type="image/png" href="assets/images/favicon.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="../styles/style.css">
</head>

<body>

    <div id="scrollProgress"></div>

    <div class="floating-shapes" aria-hidden="true">

        <span class="shape shape-1"></span>

        <span class="shape shape-2"></span>

        <span class="shape shape-3"></span>

        <span class="shape shape-4"></span>

    </div>

    <div id="header"></div>

    <main>

        <section id="backupRestoreContent" class="auth-section reveal fade-up">

            <div class="container">

                <div class="section-header">

                    <span class="page-badge floating-badge">

                        <i class="fa-solid fa-database"></i>

                        Backup & Restore

                    </span>

                    <h1>System Backup Management</h1>

                    <p>

                        Create backups, schedule automatic backups and restore the platform when necessary.

                    </p>

                </div>

                <div class="action-buttons">

                    <button id="createBackupBtn" class="btn-primary">

                        <i class="fa-solid fa-hard-drive"></i>

                        Create Backup

                    </button>

                    <button id="restoreBackupBtn" class="btn-primary">

                        <i class="fa-solid fa-clock-rotate-left"></i>

                        Restore Backup

                    </button>

                </div>

                <div class="dashboard-grid">

                    <div class="dashboard-card">

                        <i class="fa-solid fa-server"></i>

                        <h3 id="backupCount">0</h3>

                        <p>Total Backups</p>

                    </div>

                    <div class="dashboard-card">

                        <i class="fa-solid fa-clock"></i>

                        <h3 id="lastBackupTime">--</h3>

                        <p>Last Backup</p>

                    </div>

                    <div class="dashboard-card">

                        <i class="fa-solid fa-memory"></i>

                        <h3 id="backupStorage">0 GB</h3>

                        <p>Storage Used</p>

                    </div>

                    <div class="dashboard-card">

                        <i class="fa-solid fa-arrows-rotate"></i>

                        <h3 id="autoBackupStatus">Enabled</h3>

                        <p>Automatic Backup</p>

                    </div>

                </div>

                <section class="dashboard-section">

                    <div class="section-header">

                        <h2>Automatic Backup Settings</h2>

                    </div>

                    <form id="backupSettingsForm">

                        <label>

                            Backup Frequency

                            <select id="backupFrequency">

                                <option>Hourly</option>

                                <option>Daily</option>

                                <option>Weekly</option>

                                <option>Monthly</option>

                            </select>

                        </label>

                        <label>

                            Retention Period

                            <select id="retentionPeriod">

                                <option>7 Days</option>

                                <option>30 Days</option>

                                <option>90 Days</option>

                                <option>1 Year</option>

                            </select>

                        </label>

                        <label class="switch">

                            <input type="checkbox" id="autoBackupToggle" checked>

                            <span>Enable Automatic Backups</span>

                        </label>

                    </form>

                </section>

                <div class="table-responsive">

                    <table class="admin-table">

                        <thead>

                            <tr>

                                <th>Date</th>

                                <th>Backup Name</th>

                                <th>Type</th>

                                <th>Size</th>

                                <th>Status</th>

                                <th>Actions</th>

                            </tr>

                        </thead>

                        <tbody id="backupHistoryTable">

                            <!-- JS -->

                        </tbody>

                    </table>

                </div>

            </div>

        </section>

    </main>

    <div id="footer"></div>

    <script type="module" src="../js/loadAdmin.js"></script>
    <script type="module" src="../js/admin_backup_restore.js"></script>

</body>

</html>
