<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ==========================================
         Character Encoding
    =========================================== -->
    <meta charset="UTF-8">

    <!-- ==========================================
         Responsive Viewport
    =========================================== -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ==========================================
         Basic SEO
    =========================================== -->
    <title>Admin Support Tickets | ResiHub</title>

    <meta name="description"
        content="Manage support tickets submitted by students and landlords across the ResiHub platform.">

    <meta name="keywords" content="ResiHub, Support Tickets, Help Desk, Administrator">

    <meta name="author" content="ResiHub">

    <meta name="robots" content="noindex, nofollow">

    <link rel="canonical" href="https://www.resihub.com/admin_support_tickets.htm">

    <!-- ==========================================
         Open Graph
    =========================================== -->
    <meta property="og:type" content="website">

    <meta property="og:title" content="Admin Support Tickets | ResiHub">

    <meta property="og:description" content="Manage platform support requests.">

    <meta property="og:url" content="https://www.resihub.com/admin_support_tickets.htm">

    <meta property="og:image" content="https://www.resihub.com/assets/images/og-image.jpg">

    <!-- ==========================================
         Twitter Card
    =========================================== -->
    <meta name="twitter:card" content="summary_large_image">

    <meta name="twitter:title" content="Admin Support Tickets | ResiHub">

    <meta name="twitter:description" content="Administrator support center.">

    <meta name="twitter:image" content="https://www.resihub.com/assets/images/og-image.jpg">

    <!-- ==========================================
         Favicon
    =========================================== -->
    <link rel="icon" type="image/png" href="../assets/images/favicon.png">

    <!-- ==========================================
         Font Awesome Icons
    =========================================== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- ==========================================
         Global Stylesheet
    =========================================== -->
    <link rel="stylesheet" href="../styles/style.css">

</head>

<body>

    <div id="scrollProgress"></div>

    <div class="floating-shapes" aria-hidden="true">

        <span class="shape shape-1"></span>

        <span class="shape shape-2"></span>

        <span class="shape shape-3"></span>

        <span class="shape shape-4"></span>

    </div>

    <!-- ==========================================
         Dynamic Admin Header
    =========================================== -->

    <div id="header"></div>

    <main>

        <!-- ==========================================
             Support Tickets Section
        =========================================== -->

        <section id="supportTicketsContent" class="auth-section reveal fade-up">

            <div class="container">

                <!-- Page Header -->

                <div class="section-header">

                    <span class="page-badge floating-badge">

                        <i class="fa-solid fa-headset"></i>

                        Support Center

                    </span>

                    <h1>Support Tickets</h1>

                    <p>

                        Review, assign and resolve support requests from students and landlords.

                    </p>

                </div>

                <!-- ==========================================
                     Ticket Filters
                =========================================== -->

                <form id="ticketFilterForm">

                    <input type="search" id="ticketSearch" placeholder="Search tickets...">

                    <select id="ticketStatus">

                        <option value="">All Status</option>

                        <option>Open</option>

                        <option>Pending</option>

                        <option>Resolved</option>

                        <option>Closed</option>

                    </select>

                    <select id="ticketPriority">

                        <option value="">All Priority</option>

                        <option>Critical</option>

                        <option>High</option>

                        <option>Medium</option>

                        <option>Low</option>

                    </select>

                    <select id="ticketCategory">

                        <option value="">All Categories</option>

                        <option>Account</option>

                        <option>Payments</option>

                        <option>Listings</option>

                        <option>Technical</option>

                        <option>Reports</option>

                    </select>

                </form>

                <!-- ==========================================
                     Statistics
                =========================================== -->

                <div class="dashboard-grid">

                    <div class="dashboard-card">

                        <i class="fa-solid fa-ticket"></i>

                        <h3 id="totalTickets">0</h3>

                        <p>Total Tickets</p>

                    </div>

                    <div class="dashboard-card">

                        <i class="fa-solid fa-folder-open"></i>

                        <h3 id="openTickets">0</h3>

                        <p>Open Tickets</p>

                    </div>

                    <div class="dashboard-card">

                        <i class="fa-solid fa-spinner"></i>

                        <h3 id="pendingTickets">0</h3>

                        <p>Pending</p>

                    </div>

                    <div class="dashboard-card">

                        <i class="fa-solid fa-circle-check"></i>

                        <h3 id="resolvedTickets">0</h3>

                        <p>Resolved</p>

                    </div>

                </div>

                <!-- ==========================================
                     Support Tickets Table
                =========================================== -->

                <div class="table-responsive">

                    <table class="admin-table">

                        <thead>

                            <tr>

                                <th>ID</th>

                                <th>User</th>

                                <th>Category</th>

                                <th>Priority</th>

                                <th>Status</th>

                                <th>Date</th>

                                <th>Actions</th>

                            </tr>

                        </thead>

                        <tbody id="supportTicketsTable">

                            <!-- Loaded dynamically by JavaScript -->

                        </tbody>

                    </table>

                </div>

            </div>

        </section>

    </main>
    <!-- ==========================================
         Footer
    =========================================== -->

    <div id="footer"></div>

    <!-- ==========================================
         JavaScript Modules
    =========================================== -->

    <script type="module" src="../js/loadAdmin.js"></script>

    <script type="module" src="../js/admin_support_tickets.js"></script>

</body>

</html>
