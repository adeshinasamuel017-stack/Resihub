<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Bookings | ResiHub Admin</title>

    <meta name="description"
        content="Monitor and manage all booking and inspection requests on the ResiHub Administration Panel.">

    <meta name="keywords" content="ResiHub, Admin, Booking Requests, Inspection Requests, Student Accommodation">

    <meta name="author" content="ResiHub">

    <meta name="robots" content="noindex, nofollow">

    <link rel="canonical" href="https://www.resihub.com/admin_bookings.htm">

    <!-- Open Graph -->

    <meta property="og:type" content="website">

    <meta property="og:title" content="Manage Bookings | ResiHub Admin">

    <meta property="og:description"
        content="Manage inspection requests and booking activities across the ResiHub platform.">

    <meta property="og:url" content="https://www.resihub.com/admin_bookings.htm">

    <meta property="og:image" content="https://www.resihub.com/assets/images/og-image.jpg">

    <!-- Twitter -->

    <meta name="twitter:card" content="summary_large_image">

    <meta name="twitter:title" content="Manage Bookings | ResiHub Admin">

    <meta name="twitter:description" content="Review and manage all student booking requests on ResiHub.">

    <meta name="twitter:image" content="https://www.resihub.com/assets/images/og-image.jpg">

    <link rel="icon" type="image/png" href="assets/images/favicon.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="../styles/style.css">
</head>

<body>

    <div id="scrollProgress"></div>

    <div class="floating-shapes" aria-hidden="true">

        <span class="shape shape-1"></span>

        <span class="shape shape-2"></span>

        <span class="shape shape-3"></span>

        <span class="shape shape-4"></span>

    </div>
    <!-- HEADER / NAVIGATION -->

    <div id="header"></div>

    <main>

        <!-- Hero Section -->

        <section id="admin-bookings-hero" class="auth-hero reveal fade-up">

            <div class="container">

                <span class="page-badge floating-badge">

                    <i class="fa-solid fa-calendar-check"></i>

                    Booking Management

                </span>

                <h1>Manage Booking Requests</h1>

                <p>

                    Monitor inspection requests, bookings, approvals and completed reservations across the ResiHub
                    platform.

                </p>

            </div>

        </section>

        <!-- Statistics -->

        <section class="dashboard-stats reveal fade-up">

            <div class="container">

                <div class="stats-grid">

                    <div class="stat-card">

                        <i class="fa-solid fa-calendar-check"></i>

                        <h2 id="totalBookings">0</h2>

                        <p>Total Bookings</p>

                    </div>

                    <div class="stat-card">

                        <i class="fa-solid fa-hourglass-half"></i>

                        <h2 id="pendingBookings">0</h2>

                        <p>Pending</p>

                    </div>

                    <div class="stat-card">

                        <i class="fa-solid fa-circle-check"></i>

                        <h2 id="approvedBookings">0</h2>

                        <p>Approved</p>

                    </div>

                    <div class="stat-card">

                        <i class="fa-solid fa-circle-xmark"></i>

                        <h2 id="rejectedBookings">0</h2>

                        <p>Rejected</p>

                    </div>

                </div>

            </div>

        </section>

        <!-- Filters -->

        <section class="admin-filter-section reveal fade-up">

            <div class="container">

                <form id="bookingFilterForm" class="filter-bar">

                    <input type="search" id="bookingSearch" placeholder="Search by student, landlord or property...">

                    <select id="bookingStatus">

                        <option value="">All Status</option>

                        <option value="Pending">Pending</option>

                        <option value="Approved">Approved</option>

                        <option value="Rejected">Rejected</option>

                        <option value="Completed">Completed</option>

                    </select>

                    <select id="bookingSort">

                        <option value="latest">Latest First</option>

                        <option value="oldest">Oldest First</option>

                        <option value="student">Student Name</option>

                        <option value="landlord">Landlord Name</option>

                    </select>

                    <button type="submit" class="btn-primary">

                        <i class="fa-solid fa-filter"></i>

                        Apply

                    </button>

                </form>

            </div>

        </section>

        <!-- Booking Table -->

        <section class="admin-table-section reveal fade-up">

            <div class="container">

                <div class="table-responsive">

                    <table class="admin-table">

                        <thead>

                            <tr>

                                <th>ID</th>

                                <th>Student</th>

                                <th>Landlord</th>

                                <th>Property</th>

                                <th>Date</th>

                                <th>Status</th>

                                <th>Actions</th>

                            </tr>

                        </thead>

                        <tbody id="bookingTableBody">

                            <!-- Dynamic rows -->

                        </tbody>

                    </table>

                </div>

            </div>

        </section>

        <!-- Booking Details Modal -->

        <div id="bookingModal" class="modal hidden">

            <div class="modal-content">

                <button id="closeBookingModal" class="modal-close" aria-label="Close">

                    <i class="fa-solid fa-xmark"></i>

                </button>

                <h2>Booking Details</h2>

                <div id="bookingDetails">

                    <!-- Dynamic booking information -->

                </div>

                <div class="modal-actions">

                    <button id="approveBooking" class="btn-primary">

                        <i class="fa-solid fa-circle-check"></i>

                        Approve

                    </button>

                    <button id="rejectBooking" class="btn-outline">

                        <i class="fa-solid fa-circle-xmark"></i>

                        Reject

                    </button>

                </div>

            </div>

        </div>

        <!-- Pagination -->

        <section class="pagination-section reveal fade-up">

            <div class="container">

                <div id="bookingPagination" class="pagination">

                    <!-- Pagination buttons -->

                </div>

            </div>

        </section>

    </main>
    <!-- FOOTER -->

    <div id="footer"></div>

    <script type="module" src="../js/loadAdmin.js"></script>
    <script type="module" src="../js/admin_booking.js"></script>

</body>

</html>
