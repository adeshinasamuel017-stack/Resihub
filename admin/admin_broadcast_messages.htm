<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Broadcast Messages | ResiHub</title>

    <meta name="description"
        content="Create and manage platform-wide announcements and notifications for students and landlords.">

    <meta name="keywords" content="ResiHub, Broadcast Messages, Notifications, Announcements">

    <meta name="author" content="ResiHub">

    <meta name="robots" content="noindex, nofollow">

    <link rel="canonical" href="https://www.resihub.com/admin_broadcast_messages.htm">

    <meta property="og:type" content="website">

    <meta property="og:title" content="Admin Broadcast Messages | ResiHub">

    <meta property="og:description" content="Manage announcements and platform notifications.">

    <meta property="og:url" content="https://www.resihub.com/admin_broadcast_messages.htm">

    <meta property="og:image" content="https://www.resihub.com/assets/images/og-image.jpg">

    <meta name="twitter:card" content="summary_large_image">

    <meta name="twitter:title" content="Admin Broadcast Messages | ResiHub">

    <meta name="twitter:description" content="Administrator announcements.">

    <meta name="twitter:image" content="https://www.resihub.com/assets/images/og-image.jpg">

    <link rel="icon" type="image/png" href="assets/images/favicon.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="../styles/style.css">
</head>

<body>

    <div id="scrollProgress"></div>

    <div class="floating-shapes" aria-hidden="true">

        <span class="shape shape-1"></span>

        <span class="shape shape-2"></span>

        <span class="shape shape-3"></span>

        <span class="shape shape-4"></span>

    </div>

    <div id="header"></div>

    <main>

        <section id="broadcastMessagesContent" class="auth-section reveal fade-up">

            <div class="container">

                <div class="section-header">

                    <span class="page-badge floating-badge">

                        <i class="fa-solid fa-bullhorn"></i>

                        Broadcast Center

                    </span>

                    <h1>Broadcast Messages</h1>

                    <p>

                        Create announcements and send important information to students, landlords or all users.

                    </p>

                </div>

                <form id="broadcastForm">

                    <input type="text" id="broadcastTitle" placeholder="Announcement Title">

                    <select id="broadcastAudience">

                        <option value="all">All Users</option>

                        <option value="students">Students</option>

                        <option value="landlords">Landlords</option>

                        <option value="administrators">Administrators</option>

                    </select>

                    <select id="broadcastPriority">

                        <option>Normal</option>

                        <option>Important</option>

                        <option>Critical</option>

                    </select>

                    <textarea id="broadcastMessage" rows="8" placeholder="Write your announcement here..."></textarea>

                    <div class="form-actions">

                        <button type="button" id="previewBroadcastBtn" class="btn-outline">

                            <i class="fa-solid fa-eye"></i>

                            Preview

                        </button>

                        <button type="button" id="scheduleBroadcastBtn" class="btn-outline">

                            <i class="fa-solid fa-calendar-days"></i>

                            Schedule

                        </button>

                        <button type="submit" class="btn-primary">

                            <i class="fa-solid fa-paper-plane"></i>

                            Send Broadcast

                        </button>

                    </div>

                </form>

                <div class="dashboard-grid">

                    <div class="dashboard-card">

                        <i class="fa-solid fa-envelope-circle-check"></i>

                        <h3 id="messagesSent">0</h3>

                        <p>Broadcasts Sent</p>

                    </div>

                    <div class="dashboard-card">

                        <i class="fa-solid fa-users"></i>

                        <h3 id="totalRecipients">0</h3>

                        <p>Recipients</p>

                    </div>

                    <div class="dashboard-card">

                        <i class="fa-solid fa-calendar-check"></i>

                        <h3 id="scheduledMessages">0</h3>

                        <p>Scheduled</p>

                    </div>

                    <div class="dashboard-card">

                        <i class="fa-solid fa-bell"></i>

                        <h3 id="activeAnnouncements">0</h3>

                        <p>Active Notices</p>

                    </div>

                </div>

                <div class="table-responsive">

                    <table class="admin-table">

                        <thead>

                            <tr>

                                <th>Title</th>

                                <th>Audience</th>

                                <th>Priority</th>

                                <th>Status</th>

                                <th>Date</th>

                                <th>Actions</th>

                            </tr>

                        </thead>

                        <tbody id="broadcastHistory">

                            <!-- JavaScript -->

                        </tbody>

                    </table>

                </div>

            </div>

        </section>

    </main>

    <div id="footer"></div>

    <script type="module" src="../js/loadAdmin.js"></script>
    <script type="module" src="../js/admin_broadcast_messages.js"></script>

</body>

</html>
