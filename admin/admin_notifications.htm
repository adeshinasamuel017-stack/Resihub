<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Notifications | ResiHub</title>

    <meta name="description"
        content="View and manage system notifications, alerts and announcements for the ResiHub administration panel.">

    <meta name="keywords" content="ResiHub, Admin, Notifications, Alerts, Messages">

    <meta name="author" content="ResiHub">

    <meta name="robots" content="noindex, nofollow">

    <link rel="canonical" href="https://www.resihub.com/admin_notifications.htm">

    <!-- Open Graph -->

    <meta property="og:type" content="website">

    <meta property="og:title" content="Admin Notifications | ResiHub">

    <meta property="og:description" content="Manage platform notifications and announcements.">

    <meta property="og:url" content="https://www.resihub.com/admin_notifications.htm">

    <meta property="og:image" content="https://www.resihub.com/assets/images/og-image.jpg">

    <!-- Twitter -->

    <meta name="twitter:card" content="summary_large_image">

    <meta name="twitter:title" content="Admin Notifications | ResiHub">

    <meta name="twitter:description" content="Manage platform notifications and announcements.">

    <meta name="twitter:image" content="https://www.resihub.com/assets/images/og-image.jpg">

    <link rel="icon" type="image/png" href="assets/images/favicon.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="../styles/style.css">
</head>

<body>

    <div id="scrollProgress"></div>

    <div class="floating-shapes" aria-hidden="true">

        <span class="shape shape-1"></span>

        <span class="shape shape-2"></span>

        <span class="shape shape-3"></span>

        <span class="shape shape-4"></span>

    </div>
    <!-- HEADER / NAVIGATION -->

    <div id="header"></div>

    <main>

        <section id="admin-notifications-content" class="auth-section reveal fade-up">

            <div class="container">

                <div class="section-header">

                    <span class="page-badge floating-badge">

                        <i class="fa-solid fa-bell"></i>

                        Notifications

                    </span>

                    <h1>Notification Management</h1>

                    <p>

                        Send announcements, monitor system alerts and manage notifications delivered to students,
                        landlords and administrators.

                    </p>

                </div>

                <!-- Statistics -->

                <div class="dashboard-grid">

                    <div class="dashboard-card">

                        <i class="fa-solid fa-paper-plane"></i>

                        <h3 id="totalNotifications">0</h3>

                        <p>Total Notifications</p>

                    </div>

                    <div class="dashboard-card">

                        <i class="fa-solid fa-envelope-open-text"></i>

                        <h3 id="deliveredNotifications">0</h3>

                        <p>Delivered</p>

                    </div>

                    <div class="dashboard-card">

                        <i class="fa-solid fa-clock"></i>

                        <h3 id="scheduledNotifications">0</h3>

                        <p>Scheduled</p>

                    </div>

                    <div class="dashboard-card">

                        <i class="fa-solid fa-triangle-exclamation"></i>

                        <h3 id="systemAlerts">0</h3>

                        <p>System Alerts</p>

                    </div>

                </div>

                <!-- Notification Form -->

                <section class="dashboard-section">

                    <div class="section-header">

                        <h2>Create Notification</h2>

                    </div>

                    <form id="notificationForm">

                        <div class="form-group">

                            <label for="notificationTitle">

                                Title

                            </label>

                            <input type="text" id="notificationTitle" name="notificationTitle"
                                placeholder="Notification title" required>

                        </div>

                        <div class="form-group">

                            <label for="notificationAudience">

                                Audience

                            </label>

                            <select id="notificationAudience" name="notificationAudience">

                                <option value="all">

                                    Everyone

                                </option>

                                <option value="students">

                                    Students

                                </option>

                                <option value="landlords">

                                    Landlords

                                </option>

                                <option value="admins">

                                    Administrators

                                </option>

                            </select>

                        </div>

                        <div class="form-group">

                            <label for="notificationPriority">

                                Priority

                            </label>

                            <select id="notificationPriority" name="notificationPriority">

                                <option value="normal">

                                    Normal

                                </option>

                                <option value="important">

                                    Important

                                </option>

                                <option value="critical">

                                    Critical

                                </option>

                            </select>

                        </div>

                        <div class="form-group">

                            <label for="notificationMessage">

                                Message

                            </label>

                            <textarea id="notificationMessage" name="notificationMessage" rows="6"
                                placeholder="Write your notification here..." required></textarea>

                        </div>

                        <div class="action-buttons">

                            <button type="submit" id="sendNotificationBtn" class="btn-primary">

                                <i class="fa-solid fa-paper-plane"></i>

                                Send Notification

                            </button>

                            <button type="button" id="scheduleNotificationBtn" class="btn-outline">

                                <i class="fa-solid fa-calendar-days"></i>

                                Schedule

                            </button>

                            <button type="reset" class="btn-outline">

                                <i class="fa-solid fa-rotate-left"></i>

                                Clear

                            </button>

                        </div>

                    </form>

                </section>

                <!-- Search -->

                <section class="dashboard-section">

                    <div class="section-header">

                        <h2>Notification History</h2>

                    </div>

                    <form id="notificationSearchForm" role="search">

                        <input type="search" id="notificationSearch" placeholder="Search notifications...">

                        <select id="notificationStatus">

                            <option value="">

                                All Status

                            </option>

                            <option value="sent">

                                Sent

                            </option>

                            <option value="scheduled">

                                Scheduled

                            </option>

                            <option value="draft">

                                Draft

                            </option>

                        </select>

                    </form>

                    <div id="notificationHistory" class="notification-grid">

                        <!-- Notifications loaded dynamically -->

                    </div>

                </section>

                <!-- System Alerts -->

                <section class="dashboard-section">

                    <div class="section-header">

                        <h2>Recent System Alerts</h2>

                    </div>

                    <div id="systemAlertList" class="activity-list">

                        <!-- Alerts loaded dynamically -->

                    </div>

                </section>

            </div>

        </section>

    </main>
    <!-- FOOTER -->

    <div id="footer"></div>

    <script type="module" src="../js/loadAdmin.js"></script>
    <script type="module" src="../js/admin_notifications.js"></script>

</body>

</html>
