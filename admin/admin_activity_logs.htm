<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ==========================================
         Basic Meta Information
    =========================================== -->

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Activity Logs | ResiHub</title>

    <meta name="description"
        content="Monitor administrator activities, security events and system operations across the ResiHub platform.">

    <meta name="keywords" content="ResiHub, Admin Activity Logs, Administrator, Audit Logs, Security">

    <meta name="author" content="ResiHub">

    <meta name="robots" content="noindex, nofollow">

    <link rel="canonical" href="https://www.resihub.com/admin_activity_logs.htm">

    <!-- ==========================================
         Open Graph
    =========================================== -->

    <meta property="og:type" content="website">

    <meta property="og:title" content="Admin Activity Logs | ResiHub">

    <meta property="og:description" content="Track administrator actions and platform activities.">

    <meta property="og:url" content="https://www.resihub.com/admin_activity_logs.htm">

    <meta property="og:image" content="https://www.resihub.com/assets/images/og-image.jpg">

    <!-- ==========================================
         Twitter
    =========================================== -->

    <meta name="twitter:card" content="summary_large_image">

    <meta name="twitter:title" content="Admin Activity Logs | ResiHub">

    <meta name="twitter:description" content="Monitor administrator activities across the platform.">

    <meta name="twitter:image" content="https://www.resihub.com/assets/images/og-image.jpg">

    <!-- ==========================================
         Favicon
    =========================================== -->

    <link rel="icon" type="image/png" href="../assets/images/favicon.png">

    <!-- ==========================================
         Fonts & Icons
    =========================================== -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- ==========================================
         ResiHub Styles
    =========================================== -->

    <link rel="stylesheet" href="../styles/style.css">

</head>

<body>

    <!-- ==========================================
         Scroll Progress
    =========================================== -->

    <div id="scrollProgress"></div>

    <!-- ==========================================
         Floating Background Shapes
    =========================================== -->

    <div class="floating-shapes" aria-hidden="true">

        <span class="shape shape-1"></span>

        <span class="shape shape-2"></span>

        <span class="shape shape-3"></span>

        <span class="shape shape-4"></span>

    </div>

    <!-- ==========================================
         Header
    =========================================== -->

    <div id="header"></div>

    <!-- ==========================================
         Main Content
    =========================================== -->

    <main id="mainContent" class="page-transition">
        <section id="activityLogsContent" class="page-section glass-reveal floating-section">

            <div class="container page-container">

                <!-- ==========================================
                     Page Header
                =========================================== -->

                <header class="section-header">

                    <span class="page-badge floating-badge glass-card">

                        <i class="fa-solid fa-clock-rotate-left"></i>

                        Administrator Logs

                    </span>

                    <h1>Activity Logs</h1>

                    <p>

                        Monitor every administrator action performed across the
                        ResiHub platform.

                    </p>

                </header>

                <!-- ==========================================
                     Activity Filters
                =========================================== -->

                <form id="activityFilterForm" class="filter-form liquid-form" role="search"
                    aria-label="Filter Activity Logs">

                    <div class="liquid-group">

                        <input type="search" id="activitySearch" class="liquid-input"
                            placeholder="Search administrator or action..." autocomplete="off"
                            aria-label="Search administrator">

                    </div>

                    <div class="liquid-group">

                        <select id="activityAdmin" class="liquid-input" aria-label="Administrator">

                            <option value="">All Administrators</option>

                        </select>

                    </div>

                    <div class="liquid-group">

                        <select id="activityType" class="liquid-input" aria-label="Activity Type">

                            <option value="">All Activities</option>

                            <option value="login">Login</option>

                            <option value="logout">Logout</option>

                            <option value="listing">Listings</option>

                            <option value="student">Students</option>

                            <option value="landlord">Landlords</option>

                            <option value="settings">Settings</option>

                            <option value="security">Security</option>

                        </select>

                    </div>

                    <div class="liquid-group">

                        <input type="date" id="activityDate" class="liquid-input" aria-label="Activity Date">

                    </div>

                    <button type="button" id="exportLogsBtn" class="btn btn-primary azure-sweep ripple">

                        <i class="fa-solid fa-file-export"></i>

                        <span>Export</span>

                    </button>

                </form>
                <!-- ==========================================
                     Dashboard Statistics
                =========================================== -->

                <section class="dashboard-section statistics-section glass-reveal">

                    <div class="dashboard-grid statistics-grid">

                        <article class="dashboard-card statistics-card floating-card glass-card">

                            <div class="card-icon">

                                <i class="fa-solid fa-list-check"></i>

                            </div>

                            <div class="card-content">

                                <h3 id="totalActivities" class="count-up">

                                    0

                                </h3>

                                <p>Total Activities</p>

                            </div>

                        </article>

                        <article class="dashboard-card statistics-card floating-card glass-card">

                            <div class="card-icon">

                                <i class="fa-solid fa-user-shield"></i>

                            </div>

                            <div class="card-content">

                                <h3 id="activeAdmins" class="count-up">

                                    0

                                </h3>

                                <p>Active Administrators</p>

                            </div>

                        </article>

                        <article class="dashboard-card statistics-card floating-card glass-card">

                            <div class="card-icon">

                                <i class="fa-solid fa-triangle-exclamation"></i>

                            </div>

                            <div class="card-content">

                                <h3 id="securityEvents" class="count-up">

                                    0

                                </h3>

                                <p>Security Events</p>

                            </div>

                        </article>

                        <article class="dashboard-card statistics-card floating-card glass-card">

                            <div class="card-icon">

                                <i class="fa-solid fa-download"></i>

                            </div>

                            <div class="card-content">

                                <h3 id="exportsToday" class="count-up">

                                    0

                                </h3>

                                <p>Exports Today</p>

                            </div>

                        </article>

                    </div>

                </section>
                <!-- ==========================================
                     Activity Logs Table
                =========================================== -->

                <section class="table-section glass-reveal">

                    <div class="table-responsive">

                        <table class="admin-table data-table">

                            <thead>

                                <tr>

                                    <th>Time</th>

                                    <th>Administrator</th>

                                    <th>Activity</th>

                                    <th>Module</th>

                                    <th>IP Address</th>

                                    <th>Status</th>

                                    <th>Details</th>

                                </tr>

                            </thead>

                            <tbody id="activityLogsTable">

                                <!-- JavaScript loads activity logs -->

                            </tbody>

                        </table>

                    </div>

                </section>

            </div>

        </section>

    </main>

    <!-- ==========================================
         Footer
    =========================================== -->

    <div id="footer"></div>

    <!-- ==========================================
         JavaScript Modules
    =========================================== -->

    <script type="module" src="../js/loadAdmin.js"></script>

    <script type="module" src="../js/admin_activity_logs.js"></script>

</body>

</html>
