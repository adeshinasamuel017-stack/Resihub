<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Activity Logs | ResiHub</title>

    <meta name="description"
        content="Monitor administrator activities, security events and system operations across the ResiHub platform.">

    <meta name="keywords" content="ResiHub, Admin Activity Logs, Administrator, Audit Logs, Security">

    <meta name="author" content="ResiHub">

    <meta name="robots" content="noindex, nofollow">

    <link rel="canonical" href="https://www.resihub.com/admin_activity_logs.htm">

    <!-- Open Graph -->

    <meta property="og:type" content="website">

    <meta property="og:title" content="Admin Activity Logs | ResiHub">

    <meta property="og:description" content="Track administrator actions and platform activities.">

    <meta property="og:url" content="https://www.resihub.com/admin_activity_logs.htm">

    <meta property="og:image" content="https://www.resihub.com/assets/images/og-image.jpg">

    <!-- Twitter -->

    <meta name="twitter:card" content="summary_large_image">

    <meta name="twitter:title" content="Admin Activity Logs | ResiHub">

    <meta name="twitter:description" content="Monitor administrator activities across the platform.">

    <meta name="twitter:image" content="https://www.resihub.com/assets/images/og-image.jpg">

    <link rel="icon" type="image/png" href="assets/images/favicon.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="../styles/style.css">

</head>

<body>

    <div id="scrollProgress"></div>

    <div class="floating-shapes" aria-hidden="true">

        <span class="shape shape-1"></span>

        <span class="shape shape-2"></span>

        <span class="shape shape-3"></span>

        <span class="shape shape-4"></span>

    </div>
    <!-- HEADER / NAVIGATION -->

    <div id="header"></div>

    <main>

        <section id="activityLogsContent" class="auth-section reveal fade-up">

            <div class="container">

                <div class="section-header">

                    <span class="page-badge floating-badge">

                        <i class="fa-solid fa-clock-rotate-left"></i>

                        Administrator Logs

                    </span>

                    <h1>Activity Logs</h1>

                    <p>

                        Monitor every administrator action performed across
                        the ResiHub platform.

                    </p>

                </div>

                <form id="activityFilterForm" role="search" aria-label="Filter Activity Logs">

                    <input type="search" id="activitySearch" placeholder="Search administrator or action...">

                    <select id="activityAdmin">

                        <option value="">All Administrators</option>

                    </select>

                    <select id="activityType">

                        <option value="">All Activities</option>

                        <option value="login">Login</option>

                        <option value="logout">Logout</option>

                        <option value="listing">Listings</option>

                        <option value="student">Students</option>

                        <option value="landlord">Landlords</option>

                        <option value="settings">Settings</option>

                        <option value="security">Security</option>

                    </select>

                    <input type="date" id="activityDate">

                    <button type="button" id="exportLogsBtn" class="btn-primary">

                        <i class="fa-solid fa-file-export"></i>

                        Export

                    </button>

                </form>

                <div class="dashboard-grid">

                    <div class="dashboard-card">

                        <i class="fa-solid fa-list-check"></i>

                        <h3 id="totalActivities">0</h3>

                        <p>Total Activities</p>

                    </div>

                    <div class="dashboard-card">

                        <i class="fa-solid fa-user-shield"></i>

                        <h3 id="activeAdmins">0</h3>

                        <p>Active Admins</p>

                    </div>

                    <div class="dashboard-card">

                        <i class="fa-solid fa-triangle-exclamation"></i>

                        <h3 id="securityEvents">0</h3>

                        <p>Security Events</p>

                    </div>

                    <div class="dashboard-card">

                        <i class="fa-solid fa-download"></i>

                        <h3 id="exportsToday">0</h3>

                        <p>Exports Today</p>

                    </div>

                </div>

                <div class="table-responsive">

                    <table class="admin-table">

                        <thead>

                            <tr>

                                <th>Time</th>

                                <th>Administrator</th>

                                <th>Activity</th>

                                <th>Module</th>

                                <th>IP Address</th>

                                <th>Status</th>

                                <th>Details</th>

                            </tr>

                        </thead>

                        <tbody id="activityLogsTable">

                            <!-- JavaScript Loads Logs -->

                        </tbody>

                    </table>

                </div>

            </div>

        </section>

    </main>

    <div id="footer"></div>

    <script type="module" src="../js/loadAdmin.js"></script>
    <script type="module" src="../js/admin_activity_logs.js"></script>
</body>

</html>
