<!DOCTYPE html>

<html lang="en">

    <meta name="robots" content="noindex, nofollow">

    <meta property="og:type" content="website">

    <meta property="og:image" content="../assets/images/logo.png">

    <!-- Favicon -->

    <link rel="icon" type="image/png" href="../assets/images/favicon.png">

    <!-- Font Awesome -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Main Stylesheet -->

    <link rel="stylesheet" href="../styles/style.css">

</head>

<body>

    <!-- ==========================
        Header
    =========================== -->

    <div id="header"></div>

    <!-- ==========================
         Main Content
    =========================== -->

    <main class="admin-platform-settings">

        <!-- ==========================
             Breadcrumb
        =========================== -->

        <section class="breadcrumb">

            <a href="admin_dashboard.htm">

                Dashboard

            </a>

            <span>/</span>

            <span>

                Platform Settings

            </span>

        </section>

        <!-- ==========================
             Page Header
        =========================== -->

        <section class="page-header">

            <div class="page-header-content">

                <h1>

                    Platform Settings

                </h1>

                <p>

                    Configure branding, communication,
                    integrations, security and system preferences
                    from one centralized location.

                </p>

            </div>

            <div class="page-header-actions">

                <button class="btn btn-outline">

                    <i class="fa-solid fa-rotate-left"></i>

                    Reset

                </button>

                <button class="btn btn-primary">

                    <i class="fa-solid fa-floppy-disk"></i>

                    Save Changes

                </button>

            </div>

        </section>

        <!-- ==========================
             Platform Overview
        =========================== -->

        <section class="settings-overview">

            <div class="stat-card">

                <i class="fa-solid fa-circle-check"></i>

                <h3>

                    Platform Status

                </h3>

                <p>

                    Online

                </p>

            </div>

            <div class="stat-card">

                <i class="fa-solid fa-code-branch"></i>

                <h3>

                    Version

                </h3>

                <p>

                    v1.0.0

                </p>

            </div>

            <div class="stat-card">

                <i class="fa-solid fa-clock"></i>

                <h3>

                    Last Backup

                </h3>

                <p>

                    Today

                </p>

            </div>

            <div class="stat-card">

                <i class="fa-solid fa-user-shield"></i>

                <h3>

                    Updated By

                </h3>

                <p>

                    Administrator

                </p>

            </div>

        </section>

        <!-- =====================================
             SETTINGS CONTENT STARTS HERE
             (We'll build this section by section)
        ====================================== -->

    <!-- ==========================
         Reusable Admin Footer
